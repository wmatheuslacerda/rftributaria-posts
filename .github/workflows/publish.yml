name: Publicar no Instagram

on:
  push:
    branches: [main]
    paths: ["queue/**"]
  workflow_dispatch: {}

permissions:
  contents: write

# nunca roda duas publicações ao mesmo tempo (evita post duplicado)
concurrency:
  group: instagram-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publicar posts pendentes
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python3 scripts/publish.py

      - name: Registrar resultado no repositório
        if: always()
        run: |
          git config user.name "rft-bot"
          git config user.email "rft-bot@users.noreply.github.com"
          git add queue/
          git diff --cached --quiet || git commit -m "registro de publicação [skip ci]"
          git pull --rebase origin main && git push origin main
